<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drowsiness Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .monitor-layout { display: grid; grid-template-columns: 1fr 260px; height: calc(100vh - 57px); }
    .feed-panel { padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .side-panel { border-left: 1px solid #2a2a2a; padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    .alert-entry { font-size: 12px; color: #999; padding: 5px 0; border-bottom: 1px solid #1e1e1e; line-height: 1.4; }
    .alert-entry:last-child { border-bottom: none; }
  </style>
</head>
<body>
  <div class="screen">
    <div class="topbar">
      <div class="driver-info">
        <div class="avatar" id="topbar-avatar"></div>
        <div>
          <div style="font-size:14px; font-weight:500;" id="topbar-name">{{ driver }}</div>
          <div style="font-size:11px; color:#555;">Plate: {{ plate }} · Logged in {{ login_time }}</div>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:12px;">
        <span class="clock" id="clock"></span>
        <button class="btn btn-danger" style="padding:8px 16px; font-size:13px;" onclick="endSession()">End session</button>
      </div>
    </div>

    <div class="monitor-layout">
      <div class="feed-panel">
    <div class="feed-box" id="feed-box" style="position:relative; overflow:hidden;">
          <img src="/video_feed" alt="Live camera feed"
               style="position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:0;">
          <div class="corner tl awake-corners" id="c-tl" style="z-index:2;"></div>
          <div class="corner tr awake-corners" id="c-tr" style="z-index:2;"></div>
          <div class="corner bl awake-corners" id="c-bl" style="z-index:2;"></div>
          <div class="corner br awake-corners" id="c-br" style="z-index:2;"></div>
          <div class="scan-line" id="scan-line" style="background:#34d399; z-index:2;"></div>
          <div style="position:absolute; bottom:10px; left:10px; right:10px; display:flex; justify-content:space-between; align-items:center;z-index:2;">
            <span id="status-badge" style="font-size:12px; font-weight:500; padding:4px 12px; border-radius:20px; background:rgba(52,211,153,0.15); color:#34d399;">
              <span class="blink" style="display:inline-block; width:6px; height:6px; border-radius:50%; background:#34d399; margin-right:5px; vertical-align:middle;"></span>
              Awake
            </span>
            <span style="font-size:11px; color:#555;">Live · <span id="duration">00:00</span></span>
          </div>
        </div>

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">Duration</div>
            <div class="stat-value" id="stat-dur">00:00</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Alerts</div>
            <div class="stat-value status-drowsy" id="stat-alerts">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Status</div>
            <div class="stat-value status-awake" id="stat-status">Awake</div>
          </div>
        </div>
      </div>

      <div class="side-panel">
        <div style="font-size:13px; font-weight:500; color:#888;">Alert log</div>
        <div id="alert-log" style="flex:1; font-size:12px; color:#555;">No alerts yet.</div>
        <button class="btn btn-ghost" style="width:100%; font-size:13px;" onclick="endSession()">View session report</button>
      </div>
    </div>
  </div>

  <script>
    let secs = 0, alertLog = [];
    const name = "{{ driver }}";
    const initials = name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
    document.getElementById('topbar-avatar').textContent = initials;

    function pad(n){ return String(n).padStart(2,'0'); }

    setInterval(()=>{
      secs++;
      const t = pad(Math.floor(secs/60))+':'+pad(secs%60);
      document.getElementById('duration').textContent = t;
      document.getElementById('stat-dur').textContent = t;
      document.getElementById('clock').textContent = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    }, 1000);

    function setAwake(){
      ['c-tl','c-tr','c-bl','c-br'].forEach(id=>{
        const el = document.getElementById(id);
        el.classList.remove('drowsy-corners');
        el.classList.add('awake-corners');
      });
      document.getElementById('scan-line').style.background = '#34d399';
      document.getElementById('status-badge').style.background = 'rgba(52,211,153,0.15)';
      document.getElementById('status-badge').style.color = '#34d399';
      document.getElementById('status-badge').innerHTML = '<span class="blink" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#34d399;margin-right:5px;vertical-align:middle;"></span>Awake';
      document.getElementById('stat-status').textContent = 'Awake';
      document.getElementById('stat-status').className = 'stat-value status-awake';
    }

    function setDrowsy(count){
      ['c-tl','c-tr','c-bl','c-br'].forEach(id=>{
        const el = document.getElementById(id);
        el.classList.remove('awake-corners');
        el.classList.add('drowsy-corners');
      });
      document.getElementById('scan-line').style.background = '#f87171';
      document.getElementById('status-badge').style.background = 'rgba(248,113,113,0.15)';
      document.getElementById('status-badge').style.color = '#f87171';
      document.getElementById('status-badge').innerHTML = '<span class="blink" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#f87171;margin-right:5px;vertical-align:middle;"></span>Drowsy!';
      document.getElementById('stat-status').textContent = 'Drowsy!';
      document.getElementById('stat-status').className = 'stat-value status-drowsy';
      document.getElementById('stat-alerts').textContent = count;
      const t = new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
      alertLog.unshift(t + ' — Drowsy detected');
      document.getElementById('alert-log').innerHTML = alertLog.slice(0,8).map(l=>
        `<div class="alert-entry">${l}</div>`
      ).join('');
    }

    async function detect(){
      try {
        const res  = await fetch('/api/detect', { method: 'POST' });
        const data = await res.json();
        if(data.status === 'DROWSY') setDrowsy(data.alert_count);
        else setAwake();
      } catch(e) {}
    }

    setInterval(detect, 1000);

    async function endSession(){
      const res  = await fetch('/api/end_session', { method: 'POST' });
      window.location = '/report';
    }
  </script>
</body>
</html>
